name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repo and uploads the PDF.
permissions:
  contents: read

jobs:
  build-pdf:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            biber \
            cm-super

      - name: Build paper
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode htmltrust.tex
          biber htmltrust
          pdflatex -interaction=nonstopmode htmltrust.tex
          pdflatex -interaction=nonstopmode htmltrust.tex

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: htmltrust-paper
          path: paper/htmltrust.pdf
